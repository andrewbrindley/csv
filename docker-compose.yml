version: '3.8'

# ---------------------------------------------------------------------------
# Local development docker-compose.
#
# Only the Flask API is containerised. The frontend runs natively via
# `npm start` (faster iteration) and the SQS-polling worker is NOT used
# locally — the active import flow is fully synchronous inside Flask, and
# the in-process MongoDB-polling worker is started automatically by main.py.
#
# AWS env vars are intentionally absent. Set them in your AWS deployment
# (e.g. ECS task definition); locally they are not required.
# ---------------------------------------------------------------------------
services:
  flask-api:
    build:
      context: ./flask
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    env_file:
      - ./flask/.env
    volumes:
      - ./flask:/app
    command: python main.py
