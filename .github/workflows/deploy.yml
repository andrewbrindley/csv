name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master

env:
  AWS_REGION: ap-southeast-2
  ECR_API_REPOSITORY: csv-app-flask-api
  ECR_WORKER_REPOSITORY: csv-app-python-worker
  ECS_CLUSTER: csv-app-cluster
  ECS_API_SERVICE: csv-app-api-service
  ECS_WORKER_SERVICE: csv-app-worker-service
  S3_FRONTEND_BUCKET: csv-app-frontend-20260301112044003300000001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push API Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_API_REPOSITORY:latest -f flask/Dockerfile ./flask
          docker push $ECR_REGISTRY/$ECR_API_REPOSITORY:latest

      - name: Build, Tag, and Push Worker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # The worker uses the same codebase/Dockerfile as the API, just a different run command
          docker build -t $ECR_REGISTRY/$ECR_WORKER_REPOSITORY:latest -f flask/Dockerfile ./flask
          docker push $ECR_REGISTRY/$ECR_WORKER_REPOSITORY:latest

      - name: Update ECS API Service
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_API_SERVICE --force-new-deployment

      - name: Update ECS Worker Service
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_WORKER_SERVICE --force-new-deployment

      - name: Setup Node for Frontend UI
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React Frontend
        working-directory: ./react
        run: |
          npm install
          npm run build

      - name: Sync Frontend to S3 Bucket
        working-directory: ./react
        run: |
          aws s3 sync build/ s3://$S3_FRONTEND_BUCKET --delete
